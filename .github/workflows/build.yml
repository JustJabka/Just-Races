name: Build Paper Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build

      - name: capture api artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JustRacesApi
          path: justraces-api/build/libs/*.jar

      - name: capture core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JustRaces
          path: justraces-core/build/libs/*.jar

      - name: capture showcase artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JustRacesShowcase
          path: justraces-showcase/build/libs/*.jar